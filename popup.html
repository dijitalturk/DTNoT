<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTNoT</title>
  <link rel="stylesheet" href="assets/ui.css" />
</head>
<body class="popup">
  <div class="govde yigin">
    <header class="topbar">
      <span class="marka-kutu" aria-hidden="true">📝</span>
      <div class="topbar__metin min-w-0">
        <h1 class="topbar__baslik">DTNoT</h1>
        <p class="topbar__alt" id="altBaslik">Sayfada not bırak</p>
      </div>
      <div class="topbar__sag">
        <div id="diller" class="diller" role="group" aria-label="Dil"></div>
        <button type="button" id="panelAc" class="ikon-dugme ikon-dugme--soluk" title="Notlarım" aria-label="Notlarım">≡</button>
        <button type="button" id="ayarAc" class="ikon-dugme ikon-dugme--soluk" title="Ayarlar" aria-label="Ayarlar" aria-pressed="false">⚙</button>
      </div>
    </header>

    <div id="bildirim" class="durum" role="status" aria-live="polite"></div>

    <section id="ayarKutu" class="panel yigin" hidden>
      <div class="toolbar">
        <h2 id="ayarBaslik" class="bolum-baslik"></h2>
        <div class="toolbar__sag">
          <button type="button" id="ayarKapat" class="ikon-dugme ikon-dugme--soluk" title="Kapat" aria-label="Kapat">✕</button>
        </div>
      </div>
      <div class="ayar-satir">
        <label class="secici__etiket" for="gizleme" id="gizlemeEtiket"></label>
        <select id="gizleme" class="secici"></select>
        <p class="ipucu" id="gizlemeNot"></p>
      </div>
      <label class="onay"><input type="checkbox" id="sadeceAktif" /> <span id="sadeceAktifEtiket"></span></label>
      <div class="altbilgi">
        <a id="yeniSayfadaAc" class="altbilgi__link" href="options.html" target="_blank" rel="noreferrer noopener">
          <span id="yeniSayfadaAcMetin"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 3h7v7"></path>
            <path d="M21 3l-9 9"></path>
            <path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path>
          </svg>
        </a>
      </div>
    </section>

    <section id="izinKutu" class="panel panel--uyari yigin" hidden>
      <b id="izinBaslik"></b>
      <p id="izinMetin" class="ipucu"></p>
      <div class="toolbar">
        <button type="button" id="izinVer" class="btn btn--kucuk"></button>
      </div>
    </section>

    <section class="panel yigin">
      <div class="toolbar">
        <span id="notRenk" class="renk-nokta" hidden></span>
        <span class="etiket" id="sayfaEtiket">Bu sayfa</span>
        <span id="bannerRozet" class="pill pill--warn" hidden>BANNER</span>
        <div class="toolbar__sag">
          <span id="canliRozet" class="pill pill--ok" hidden>✓</span>
          <button type="button" id="silDugme" class="btn btn--pill btn--danger" hidden>Sil</button>
        </div>
      </div>
      <p id="sayfaAdres" class="ipucu truncate" title="">…</p>

      <button type="button" id="ekleAc" class="btn btn--primary">Not ekle</button>

      <div id="ekleKutu" class="yigin" hidden>
        <textarea id="metin" class="girdi" maxlength="4000"></textarea>
        <div class="toolbar">
          <span class="etiket" id="renkEtiket"></span>
          <div id="renkler" class="renkler" role="group"></div>
          <span id="renkSecili" class="renk-secili"></span>
        </div>
        <label class="onay"><input type="checkbox" id="bannerChk" /> <span id="bannerEtiket"></span></label>
        <p class="ipucu" id="bannerNotu"></p>
        <label class="onay"><input type="checkbox" id="siteGeneliChk" disabled /> <span id="siteGeneliEtiket"></span></label>
        <p class="ipucu" id="siteGeneliNotu"></p>
        <button type="button" id="kaydet" class="btn btn--primary">Kaydet</button>
        <button type="button" id="vazgec" class="btn">Vazgeç</button>
      </div>

      <p id="notOnizleme" class="ipucu" hidden></p>
    </section>

    <section class="panel yigin">
      <div class="toolbar">
        <h2 id="havuzBaslik" class="bolum-baslik">Notlarım</h2>
        <div class="toolbar__sag">
          <span id="toplamRozet" class="pill pill--soluk">0</span>
        </div>
      </div>
      <p class="ipucu" id="havuzNotu"></p>
      <button type="button" id="panelDugme" class="btn">Tüm notlar</button>
    </section>

    <div class="altbilgi">
      <span id="altBilgi"></span>
      <a id="dtLink" class="altbilgi__link" href="https://DijitalTurk.com" target="_blank" rel="noreferrer noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18"></path>
          <path d="M12 3c2.6 3.2 2.6 14.8 0 18"></path>
          <path d="M12 3c-2.6 3.2-2.6 14.8 0 18"></path>
        </svg>
        <span>DijitalTurk.com</span>
      </a>
    </div>
  </div>

  <script src="assets/store.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
