<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTNoT — Ayarlar</title>
  <link rel="stylesheet" href="assets/ui.css" />
</head>
<body class="tam-sayfa">
  <div class="govde">
    <header class="ust" style="border:1px solid var(--cizgi);border-radius:12px;box-shadow:var(--golge)">
      <div class="marka">DTNoT<small id="altBaslik">Ayarlar</small></div>
      <div id="diller" class="diller" role="group" aria-label="Dil"></div>
    </header>

    <section class="kart" style="margin-top:14px">
      <h2 id="baslikDil"></h2>
      <p class="ipucu" id="dilNot"></p>
      <div id="dilSatir" class="satir" style="margin-top:8px"></div>
    </section>

    <section class="kart" style="margin-top:12px">
      <h2 id="baslikDavranis"></h2>
      <div class="ayar-grup" style="margin-top:8px">
        <div class="ayar-satir">
          <label class="etiket" for="gizleme" id="gizlemeEtiket"></label>
          <select id="gizleme" class="alan"></select>
          <p class="ipucu" id="gizlemeNot"></p>
        </div>
        <label class="onay"><input type="checkbox" id="sadeceAktif" /> <span id="sadeceAktifEtiket"></span></label>
      </div>
    </section>

    <section class="kart" style="margin-top:12px">
      <h2 id="baslikVeri"></h2>
      <p class="ipucu" id="veriNot"></p>
      <div class="satir" style="margin-top:10px">
        <button type="button" id="disaAktar" class="dugme"></button>
        <select id="strateji" class="alan" style="max-width:260px"></select>
        <button type="button" id="iceAktar" class="dugme dugme--ikincil"></button>
        <input type="file" id="dosya" accept="application/json,.json" hidden />
      </div>
      <p class="ipucu" id="iceUyari" style="margin-top:8px"></p>
    </section>

    <div id="bildirim" class="durum" style="margin-top:10px"></div>

    <section class="kart" style="margin-top:12px">
      <h2 id="baslikHakkinda"></h2>
      <p class="ipucu" id="hakkindaMetin" style="margin-top:6px"></p>
      <div class="kv" style="margin-top:8px"><b id="surumEtiket"></b><span id="surum"></span></div>
      <div class="kv"><b id="gelistiriciEtiket"></b><a href="https://dijitalturk.com" target="_blank" rel="noopener noreferrer">DijitalTurk.com</a></div>
    </section>
  </div>

  <script src="assets/store.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
