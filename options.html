<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTNoT — Ayarlar</title>
  <link rel="stylesheet" href="assets/ui.css" />
</head>
<body class="tam-sayfa">
  <div class="govde yigin">
    <header class="topbar">
      <span class="marka-kutu" aria-hidden="true">📝</span>
      <div class="topbar__metin min-w-0">
        <h1 class="topbar__baslik">DTNoT</h1>
        <p class="topbar__alt" id="altBaslik">Ayarlar</p>
      </div>
    </header>

    <div id="bildirim" class="durum" role="status" aria-live="polite"></div>

    <section class="panel katlanir" data-acik="true">
      <button type="button" class="katlanir__baslik" aria-expanded="true" aria-controls="govdeDavranis">
        <span class="katlanir__ok" aria-hidden="true">▾</span>
        <span class="katlanir__ad" id="baslikDavranis"></span>
        <span class="katlanir__ozet" id="ozetDavranis"></span>
      </button>
      <div class="katlanir__govde yigin" id="govdeDavranis">
        <div class="ayar-satir">
          <label class="secici__etiket" for="gizleme" id="gizlemeEtiket"></label>
          <select id="gizleme" class="secici"></select>
          <p class="ipucu" id="gizlemeNot"></p>
        </div>
        <label class="onay"><input type="checkbox" id="sadeceAktif" /> <span id="sadeceAktifEtiket"></span></label>
        <div class="ayar-satir">
          <label class="secici__etiket" for="tema" id="temaEtiket"></label>
          <select id="tema" class="secici"></select>
        </div>
      </div>
    </section>

    <section class="panel katlanir" data-acik="false">
      <button type="button" class="katlanir__baslik" aria-expanded="false" aria-controls="govdeVeri">
        <span class="katlanir__ok" aria-hidden="true">▸</span>
        <span class="katlanir__ad" id="baslikVeri"></span>
        <span class="katlanir__ozet" id="ozetVeri"></span>
      </button>
      <div class="katlanir__govde yigin" id="govdeVeri" hidden>
        <p class="ipucu" id="veriNot"></p>
        <button type="button" id="disaAktar" class="btn btn--primary"></button>
        <div class="toolbar">
          <select id="strateji" class="secici flex-1"></select>
          <button type="button" id="iceAktar" class="btn"></button>
          <input type="file" id="dosya" accept="application/json,.json" hidden />
        </div>
        <p class="ipucu" id="iceUyari"></p>
      </div>
    </section>

    <section class="panel katlanir" data-acik="true">
      <button type="button" class="katlanir__baslik" aria-expanded="true" aria-controls="govdeHakkinda">
        <span class="katlanir__ok" aria-hidden="true">▾</span>
        <span class="katlanir__ad" id="baslikHakkinda"></span>
        <span class="katlanir__ozet" id="ozetHakkinda"></span>
      </button>
      <div class="katlanir__govde yigin" id="govdeHakkinda">
        <p class="ipucu" id="hakkindaMetin"></p>
        <div class="kv-liste">
          <div class="kv"><b id="surumEtiket"></b><span id="surum"></span></div>
          <div class="kv"><b id="gelistiriciEtiket"></b><a href="https://dijitalturk.com" target="_blank" rel="noopener noreferrer">DijitalTurk.com</a></div>
        </div>
      </div>
    </section>

    <div class="altbilgi">
      <span id="altBilgi"></span>
      <a class="altbilgi__link" href="https://DijitalTurk.com" target="_blank" rel="noreferrer noopener">DijitalTurk.com</a>
    </div>
  </div>

  <script src="assets/store.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/tema.js"></script>
  <script src="options.js"></script>
</body>
</html>
